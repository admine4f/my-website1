    <!-- Telegram WebApp Pre-Init & Version 8.0 Safety -->
    <script>
      (function() {
        var origErr = console.error;
        console.error = function() {
          if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].indexOf('CloudStorage is not supported') !== -1) {
            return;
          }
          return origErr.apply(console, arguments);
        };

        try {
          var h = window.location.hash || '';
          var s = window.location.search || '';
          if (h.indexOf('tgWebAppVersion=') === -1 && s.indexOf('tgWebAppVersion=') === -1) {
            var prefix = h ? h + '&' : '#';
            if (window.history && window.history.replaceState) {
              window.history.replaceState(null, '', window.location.pathname + window.location.search + prefix + 'tgWebAppVersion=8.0&tgWebAppPlatform=android');
            }
          }
        } catch (e) {}
      })();
    </script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function() {
        try {
          // 1. Immediate Telegram Viewport Initialization
          if (window.Telegram && window.Telegram.WebApp) {
            var tg = window.Telegram.WebApp;
            try {
              tg.isVersionAtLeast = function() { return true; };
            } catch (e) {}
            try {
              Object.defineProperty(tg, 'version', {
                get: function() { return '8.0'; },
                set: function() {},
                configurable: true
              });
            } catch (e) {
              try { tg.version = '8.0'; } catch (e2) {}
            }

            try {
              tg.isVersionAtLeast = function(ver) { return true; };
            } catch (e) {}

            var safeStorage = {
              setItem: function(key, value, cb) {
                try { localStorage.setItem('tg_cloud_' + key, String(value)); if (cb) cb(null, true); } catch (e) { if (cb) cb(e); }
                return this;
              },
              getItem: function(key, cb) {
                try { var val = localStorage.getItem('tg_cloud_' + key); if (cb) cb(null, val); } catch (e) { if (cb) cb(e); }
                return this;
              },
              getItems: function(keys, cb) {
                try {
                  var res = {};
                  (keys || []).forEach(function(k) { res[k] = localStorage.getItem('tg_cloud_' + k); });
                  if (cb) cb(null, res);
                } catch (e) { if (cb) cb(e); }
                return this;
              },
              removeItem: function(key, cb) {
                try { localStorage.removeItem('tg_cloud_' + key); if (cb) cb(null, true); } catch (e) { if (cb) cb(e); }
                return this;
              },
              removeItems: function(keys, cb) {
                try { (keys || []).forEach(function(k) { localStorage.removeItem('tg_cloud_' + k); }); if (cb) cb(null, true); } catch (e) { if (cb) cb(e); }
                return this;
              },
              getKeys: function(cb) {
                try {
                  var keys = [];
                  for (var i = 0; i < localStorage.length; i++) {
                    var k = localStorage.key(i);
                    if (k && k.indexOf('tg_cloud_') === 0) keys.push(k.replace('tg_cloud_', ''));
                  }
                  if (cb) cb(null, keys);
                } catch (e) { if (cb) cb(e); }
                return this;
              }
            };

            try {
              Object.defineProperty(tg, 'CloudStorage', {
                get: function() { return safeStorage; },
                set: function() {},
                configurable: true
              });
            } catch (e) {
              tg.CloudStorage = safeStorage;
            }

            try { tg.ready(); } catch (e) {}
            try { tg.expand(); } catch (e) {}
            try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
            try { if (tg.enableClosingConfirmation) tg.enableClosingConfirmation(); } catch (e) {}
          }

          // 2. Sync Launch Params to SessionStorage for Telegram Mini App SDKs
          var fullHref = window.location.href || '';
          var hash = window.location.hash || '';
          var search = window.location.search || '';
          var srcStr = (hash.indexOf('tgWebAppData=') !== -1) ? hash : ((search.indexOf('tgWebAppData=') !== -1) ? search : '');
          var initData = '';
          var platform = 'android';
          var version = '8.0';
          var theme = '{}';

          if (srcStr) {
            var clean = srcStr.replace(/^[#?]/, '');
            var p = new URLSearchParams(clean);
            initData = p.get('tgWebAppData') || '';
            platform = p.get('tgWebAppPlatform') || platform;
            version = p.get('tgWebAppVersion') || version;
            theme = p.get('tgWebAppThemeParams') || theme;
          } else if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) {
            initData = window.Telegram.WebApp.initData;
            platform = window.Telegram.WebApp.platform || platform;
            version = window.Telegram.WebApp.version || version;
            try {
              theme = JSON.stringify(window.Telegram.WebApp.themeParams || {});
            } catch (e) {}
          }

          if (initData) {
            var payload = JSON.stringify({
              tgWebAppData: initData,
              tgWebAppPlatform: platform,
              tgWebAppVersion: version,
              tgWebAppThemeParams: theme
            });
            sessionStorage.setItem('__telegram__initParams', payload);
            sessionStorage.setItem('adsgram/launch-params', payload);
            sessionStorage.setItem('telegram-apps/launch-params', payload);
            sessionStorage.setItem('tapps/launchParams', payload);
            sessionStorage.setItem('tma.js/launch-params', payload);

            // Ensure window.location.hash retains tgWebAppData for Adsgram URL parser
            if (!window.location.hash.includes('tgWebAppData=')) {
              var newHash = 'tgWebAppData=' + encodeURIComponent(initData) + '&tgWebAppPlatform=' + encodeURIComponent(platform) + '&tgWebAppVersion=' + encodeURIComponent(version);
              if (window.history && window.history.replaceState) {
                window.history.replaceState(null, '', window.location.pathname + window.location.search + '#' + newHash);
              }
            }
          }
        } catch (err) {
          console.warn('[TG Param Sync Warn]:', err);
        }
      })();
    </script>
    <!-- RichAds Telegram Mini App SDK (First Ad Tag) -->
    <script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>
    <script>
      try {
        if (typeof TelegramAdsController !== 'undefined') {
          window.TelegramAdsController = new TelegramAdsController();
          window.TelegramAdsController.initialize({
            pubId: "1025839",
            appId: "9319",
          });
        }
      } catch (e) {
        console.warn('[RichAds Controller Init Warn]:', e);
      }

      // Global In-App RichAds Telegram Bridge (never opens an external browser).
      // RichAds has one SDK but different ad FORMATS, each started by its own method:
      //   zone 410203 = interstitial VIDEO  -> triggerInterstitialVideo()
      //   zone 410202 = interstitial BANNER -> triggerInterstitialBanner()
      //   zone 410204 = playable / any      -> first available method
      // The right method is tried first; if RichAds has no ad for it, the other formats are tried too.
      // Resolves TRUE only when RichAds reports a successful ad; FALSE when nothing could be shown.
      // The exact reason is saved in window.__e4fRichAdsLast so the app can show it on screen.
      window.__e4fRichAdsLast = '';
      window.showRichAdsInTelegram = function(richadsId) {
        return new Promise(function(resolve) {
          var finished = false;
          function fin(v, why) {
            if (finished) return;
            finished = true;
            window.__e4fRichAdsLast = v ? '' : String(why || 'not displayed');
            console.log('[RichAds] result =', v, why || '');
            resolve(v);
          }
          try {
            var ctrl = window.TelegramAdsController;
            if (!ctrl) return fin(false, 'RichAds SDK not loaded (check ad blocker / domain approval)');
            var id = String(richadsId || '');
            var order = id === '410203'
              ? ['triggerInterstitialVideo', 'triggerInterstitialBanner']
              : id === '410202'
                ? ['triggerInterstitialBanner', 'triggerInterstitialVideo']
                : ['triggerPlayable', 'triggerPlayableAd', 'triggerInterstitialVideo', 'triggerInterstitialBanner'];
            var methods = order.filter(function(m) { return typeof ctrl[m] === 'function'; });
            if (!methods.length) return fin(false, 'RichAds SDK has no ad method');
            var lastErr = '';
            var i = 0;
            function next() {
              if (finished) return;
              if (i >= methods.length) return fin(false, 'no ad available' + (lastErr ? ' (' + lastErr + ')' : ''));
              var m = methods[i++];
              try {
                var r = ctrl[m]();  // exactly as documented: richadsController.triggerInterstitialVideo() / triggerInterstitialBanner()
                if (r && typeof r.then === 'function') {
                  r.then(function() { fin(true, m + ' completed'); },
                         function(err) { lastErr = m + ': ' + (err && (err.message || err) || 'not displayed'); console.warn('[RichAds]', lastErr); next(); });
                } else {
                  lastErr = m + ': unexpected sdk response';
                  next();
                }
              } catch (e) { lastErr = m + ': ' + (e && e.message || e); next(); }
            }
            next();
            setTimeout(function() { fin(false, 'timeout'); }, 180000);
          } catch (e) {
            console.error('RichAds invoke error:', e);
            fin(false, 'exception: ' + (e && e.message || e));
          }
        });
      };
    </script>

    <!-- Monetag Telegram Mini App SDK (Zone 12044377) -->
    <script src="https://libtl.com/sdk.js" data-zone="12044377" data-sdk="show_12044377"></script>
    <!-- OnClickA TMA In-Stream Ad Manager (window.initCdTma) -->
    <script src="https://js.onclckvd.com/in-stream-ad-admanager/tma.js"></script>
    <script>
      // In-App Monetag Telegram Bridge: Rewarded Interstitial (plays INSIDE the Mini App, never 'pop').
      // ymid = our ad-session id (lets Monetag confirm the view to our server via postback).
      // catchIfNoFeed:true = if Monetag has no ad, the promise REJECTS (so nobody is rewarded without an ad).
      // Resolves TRUE only when Monetag confirms the ad was watched; FALSE for no-fill / error.
      window.showMonetagInsideTelegram = function(ymid) {
        return new Promise(function(resolve) {
          var finished = false;
          function fin(v) { if (!finished) { finished = true; resolve(v); } }
          function run(withOpts) {
            var t0 = Date.now();
            var fn = window.show_12044377;
            var res;
            try {
              var opts = {};
              if (withOpts && ymid) opts.ymid = String(ymid);
              res = withOpts ? fn(opts) : fn();
            } catch (e) {
              console.warn('[Monetag] error:', e);
              return withOpts ? run(false) : fin(false);
            }
            if (res && typeof res.then === 'function') {
              res.then(function() { fin(true); }).catch(function(err) {
                console.warn('[Monetag] rejected:', err);
                // Rejected instantly with options => retry once with the plain documented call.
                if (withOpts && Date.now() - t0 < 1500) run(false); else fin(false);
              });
            } else {
              fin(false);
            }
          }
          // Wait up to 4s for the SDK script to define the function.
          var waited = 0;
          (function boot() {
            if (typeof window.show_12044377 === 'function') return run(true);
            if (waited >= 4000) { console.warn('[Monetag] SDK not ready'); return fin(false); }
            waited += 250; setTimeout(boot, 250);
          })();
          setTimeout(function() { fin(false); }, 180000);
        });
      };
    </script>
